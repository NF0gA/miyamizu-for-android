name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Download Gradle 8.7
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            --output /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

      - name: Fetch native source dependencies
        run: bash scripts/fetch_native_libs.sh

      - name: Build debug APK
        run: /tmp/gradle-8.7/bin/gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Miyamizu-android-debug
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/outputs/logs/**
